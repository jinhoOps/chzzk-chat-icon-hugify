name: Release Hugify extension

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate release version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$tag_version" != "$manifest_version" || "$tag_version" != "$package_version" ]]; then
            echo "Tag and manifest/package versions must match: $tag_version / $manifest_version / $package_version" >&2
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Package extension runtime
        id: package
        shell: bash
        run: |
          set -euo pipefail
          archive="hugify-extension.zip"
          zip -r "$archive" manifest.json icons src
          unzip -l "$archive" | grep -q 'manifest.json'
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.archive }}" \
            --title "치지직 이모티콘 커져라! Hugify! v${{ steps.metadata.outputs.version }}" \
            --generate-notes
