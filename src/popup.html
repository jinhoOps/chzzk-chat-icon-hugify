<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>치지직 이모티콘 커져라! Hugify!</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="logo-box" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00ffa3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <circle cx="9" cy="9" r="1" fill="#00ffa3"></circle>
            <circle cx="13" cy="9" r="1" fill="#00ffa3"></circle>
            <path d="M8.5 12.5a3.5 3.5 0 0 0 5 0"></path>
          </svg>
        </div>
        <div class="title-wrap">
          <h1 class="title">치지직 이모티콘 커져라!</h1>
          <span class="version">Hugify! · v1.0.0</span>
        </div>
      </div>
      <div id="status-badge" class="badge badge-active">사용 중</div>
    </header>

    <section class="section">
      <div class="control-row">
        <div class="control-label">
          <span class="label-title">이모티콘 확대</span>
          <span class="label-sub">마우스를 올리면 크게 보여줍니다</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-enabled" checked>
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <footer class="footer">
      치지직 채팅 이모티콘에 마우스를 올려보세요.
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
