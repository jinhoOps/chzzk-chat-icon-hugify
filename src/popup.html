<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커져라! Hugify!</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="hero">
      <div class="brand">
        <a
          class="brand-icon"
          href="https://chzzk.naver.com/43c05c91ae59803c7b3f267753b73b65"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="수땡 치지직 채널"
          title="수땡 치지직 채널"
        >
          <img src="../icons/icon128.png" alt="">
        </a>
        <h1>커져라! <span>Hugify!</span></h1>
      </div>
      <button
        id="status-badge"
        class="status status-on"
        type="button"
        aria-label="이모티콘 확대 끄기"
        aria-pressed="true"
      >ON</button>
    </header>

    <section id="update-notice" class="update-notice" aria-label="업데이트 알림" hidden>
      <p class="update-title">새 버전 <strong id="update-latest"></strong> 나왔어요!</p>
      <p class="update-help">버튼을 누르면 새 버전으로 바꿔 드려요.</p>
      <div class="update-actions">
        <button id="update-open" class="update-button" type="button">업데이트하기</button>
        <a
          id="update-link"
          class="update-link"
          href="https://github.com/jinhoOps/chzzk-chat-icon-hugify/releases/latest"
          target="_blank"
          rel="noopener noreferrer"
        >변경 내용</a>
      </div>
    </section>

    <section class="size-section" aria-label="확대 옵션">
      <div class="size-options">
        <label class="size-option">
          <input type="radio" id="size-90" name="size" value="90" checked>
          <span class="size-choice">
            <img class="size-preview" src="../icons/cha02.png" alt="">
            <strong>90 × 90px</strong>
            <small>크게</small>
          </span>
        </label>
        <label class="size-option">
          <input type="radio" id="size-120" name="size" value="120">
          <span class="size-choice">
            <img class="size-preview" src="../icons/cha02.png" alt="">
            <strong>120 × 120px</strong>
            <small>더 크게</small>
          </span>
        </label>
      </div>
    </section>

    <section class="scope-section" aria-label="확대 범위">
      <label class="scope-option" for="chat-area">
        <span class="scope-text">
          <strong>채팅창 이모티콘도 확대</strong>
          <small>끄면 이모티콘 선택창에서만 확대돼요</small>
        </span>
        <input type="checkbox" id="chat-area" class="scope-check" checked>
        <span class="scope-pill" aria-hidden="true"></span>
      </label>
    </section>

    <p id="settings-refresh-notice" class="settings-refresh-notice" role="status" aria-live="polite" hidden>
      설정은 바로 적용돼요. 바뀌지 않으면 치지직 페이지를 새로고침해 주세요.
    </p>

    <nav class="footer-links" aria-label="바로가기">
      <a
        class="footer-link"
        href="https://chzzk.naver.com/live/43c05c91ae59803c7b3f267753b73b65"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="수땡 치지직 라이브"
        title="수땡 치지직 라이브"
      >
        <img class="footer-image" src="../icons/suttaeng_chzzklive.png" alt="">
      </a>
      <a
        class="footer-link footer-link-disabled"
        href="https://chzzk.naver.com/43c05c91ae59803c7b3f267753b73b65"
        aria-label="수땡 카카오톡 (준비 중)"
        aria-disabled="true"
        tabindex="-1"
        title="오픈카톡 예정"
      >
        <img class="footer-image" src="../icons/suttaeng_kakao.png" alt="">
      </a>
      <a
        class="footer-link"
        href="https://discord.gg/4vuZb5rBRE"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="수땡 Discord"
        title="수땡 Discord"
      >
        <img class="footer-image" src="../icons/suttaeng_discord.png" alt="">
      </a>
      <a
        class="footer-link"
        href="https://github.com/jinhoOps/chzzk-chat-icon-hugify"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Hugify GitHub 저장소"
        title="Hugify GitHub 저장소"
      >
        <img class="footer-image" src="../icons/dev-github.png" alt="">
      </a>
    </nav>
  </main>

  <script src="popup.js"></script>
</body>
</html>
