<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커져라! Hugify!</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="hero">
      <div class="brand">
        <div class="brand-icon">
          <img src="../icons/icon48.png" alt="">
        </div>
        <h1>커져라! <span>Hugify!</span></h1>
      </div>
      <button
        id="status-badge"
        class="status status-on"
        type="button"
        aria-label="이모티콘 확대 끄기"
        aria-pressed="true"
      >ON</button>
    </header>

    <section class="size-section" aria-labelledby="size-label">
      <div class="section-heading">
        <h2 id="size-label">크기</h2>
      </div>
      <div class="size-options">
        <label class="size-option">
          <input type="radio" id="size-90" name="size" value="90" checked>
          <span class="size-choice">
            <img class="size-preview" src="../icons/cha02.png" alt="">
            <strong>90 × 90px</strong>
            <small>기본</small>
          </span>
        </label>
        <label class="size-option">
          <input type="radio" id="size-120" name="size" value="120">
          <span class="size-choice">
            <img class="size-preview" src="../icons/cha02.png" alt="">
            <strong>120 × 120px</strong>
            <small>크게 보기</small>
          </span>
        </label>
      </div>
    </section>

    <a
      class="stream-link"
      href="https://chzzk.naver.com/live/43c05c91ae59803c7b3f267753b73b65"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="수땡 방송"
      title="수땡 방송"
    >
      <img class="stream-image" src="../icons/suttaeng.png" alt="">
    </a>
  </main>

  <script src="popup.js"></script>
</body>
</html>
