<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커져라! Hugify!</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="hero">
      <div class="brand">
        <div class="brand-icon">
          <img src="../icons/icon48.png" alt="">
        </div>
        <h1>커져라! <span>Hugify!</span></h1>
      </div>
      <span id="status-badge" class="status status-on">ON</span>
    </header>

    <section class="setting-card" aria-labelledby="enabled-label">
      <div class="setting-row">
        <h2 id="enabled-label">이모티콘 확대</h2>
        <label class="switch" aria-label="이모티콘 확대 켜기/끄기">
          <input type="checkbox" id="toggle-enabled" checked>
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <section class="size-section" aria-labelledby="size-label">
      <div class="section-heading">
        <h2 id="size-label">크기</h2>
        <span>PREVIEW</span>
      </div>
      <div class="size-options">
        <label class="size-option">
          <input type="radio" id="size-90" name="size" value="90" checked>
          <span class="size-choice">
            <strong>90 × 90</strong>
            <small>기본</small>
          </span>
        </label>
        <label class="size-option">
          <input type="radio" id="size-120" name="size" value="120">
          <span class="size-choice">
            <strong>120 × 120</strong>
            <small>크게 보기</small>
          </span>
        </label>
      </div>
    </section>

    <a
      class="stream-link"
      href="https://chzzk.naver.com/live/43c05c91ae59803c7b3f267753b73b65"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="stream-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="3"></rect>
          <path d="m10 9 5 3-5 3V9Z" fill="currentColor" stroke="none"></path>
        </svg>
      </span>
      <span class="stream-label">수땡 방송 바로가기</span>
      <svg class="external-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 5h5v5"></path>
        <path d="m19 5-8 8"></path>
        <path d="M19 13v4a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"></path>
      </svg>
    </a>
  </main>

  <script src="popup.js"></script>
</body>
</html>
