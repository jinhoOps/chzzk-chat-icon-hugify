<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hugify 업데이트</title>
  <link rel="stylesheet" href="update.css">
</head>
<body>
  <main class="card">
    <header class="head">
      <img src="../icons/icon128.png" alt="" width="48" height="48">
      <h1>커져라! <span>Hugify!</span> 업데이트</h1>
    </header>

    <section id="update-main">
      <p class="versions">
        지금 <strong id="current-version">-</strong>
        <span class="arrow" aria-hidden="true">→</span>
        새 버전 <strong id="latest-version">-</strong>
      </p>

      <div id="folder-guide" class="guide">
        <p><strong>처음 한 번만</strong> 설치 폴더를 골라 주세요.</p>
        <ol>
          <li>아래 버튼을 누르면 폴더 선택 창이 열려요.</li>
          <li>확장 프로그램을 로드할 때 골랐던 폴더(<code>manifest.json</code>이 들어 있는 폴더)를 선택하세요.</li>
          <li>"파일 수정 허용" 질문이 나오면 <strong>수정 허용</strong>을 누르세요.</li>
        </ol>
        <p class="tip">폴더가 기억나지 않으면 확장 관리 화면에서 Hugify의 <strong>세부정보</strong>를 열어 "소스" 경로를 확인하세요.</p>
      </div>

      <button id="start-update" class="primary" type="button" disabled>업데이트하기</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <button id="reset-folder" class="link" type="button" hidden>설치 폴더 다시 고르기</button>
    </section>

    <section id="update-done" hidden>
      <p class="done-title"><strong id="done-version"></strong> 업데이트 완료!</p>
      <p>열려 있던 치지직 탭은 새로고침했어요. 이 탭은 닫아도 돼요.</p>
    </section>
  </main>

  <script type="module" src="update.js"></script>
</body>
</html>
